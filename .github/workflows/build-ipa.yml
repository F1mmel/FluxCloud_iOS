name: Build & Release iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release FluxCloud IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Archive (Unsigned)
        run: |
          mkdir -p build
          xcodebuild archive \
            -project FluxCloud.xcodeproj \
            -scheme FluxCloud \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/FluxCloud.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "build/FluxCloud.xcarchive/Products/Applications/FluxCloud.app" Payload/
          zip -qr FluxCloud.ipa Payload
          ls -la FluxCloud.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxCloud-iOS-IPA
          path: FluxCloud.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FluxCloud iOS v1.0.${{ github.run_number }}
          body: |
            Automated Release for FluxCloud iOS Client.

            - Tag: `v1.0.${{ github.run_number }}`
            - Commit: `${{ github.sha }}`

            ### Installation
            Download `FluxCloud.ipa` below and install it on your iOS device via AltStore, TrollStore, Sideloadly, or LiveContainer.
          files: FluxCloud.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
